    post:
      summary: Create a goal for a user in your organization, including metrics sourced from the same person. Make sure you have `Data-Admin` permission for your access token.
      description: Create a goal for a user in your organization, including metrics sourced from the same person. Make sure you have `Data-Admin` permission for your access token.
      tags:
      - Goal (Objective)
      requestBody:
        content:
          application/json:
            schema:
              properties:
                goals:
                  type: array
                  items:
                    type: object
                    properties:
                      goal_name:
                        description: The name of your goal.
                        type: string
                      goal_narrative:
                        description: A description or narrative for your goal.
                        type: string
                      goal_owner:
                        description: Either the unique user id or email address belonging to the goal owner.
                        type: string
                      goal_type:
                        description: The goal type. Permitted values are "1" (Team goal) or "2" (Personal goal).
                        type: string
                      goal_start_date:
                        description: The start date for the goal as a valid date string.
                        type: string
                      goal_target_date:
                        description: The end date for the goal as a valid date string (must be later than the goal_start_date).
                        type: string
                      goal_permission:
                        description: Comma-separated list of view permissions for the goal. Permitted values for team goals are "team", "report", "internal", "any". Permitted values for personal goals are "owner", "manager", "internal".
                        type: string
                      goal_team:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: An array of team_id or team_name that your team members have created in the organization
                              type: string
                      goal_category:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: An array of category_id or category_name that your team members have created in the organization
                              type: string
                      goal_metrics:
                        description: An array of goal metrics, formatted as an array.
                        type: array
                        items:
                          type: object
                          required:
                          - metric_name
                          properties:
                            metric_name:
                              description: Required The name of your metric.
                              type: string
                            metric_owner:
                              description: Either the unique user id or email address belonging to the goal owner.
                              type: string
                            metric_source_from:
                              description: The source of the metric. Currently, the only permitted value is "1".
                              type: string
                            metric_update_interval:
                              description: The update interval for the metric. Permitted values "1" (daily), "2" (weekly), "3" (monthly), "4" (quarterly).
                              type: string
                            metric_counting_type:
                              description: The relationship between the starting value and the target. Permitted values "1" (counting up), "2" (counting down), "3" (exact to target).
                              type: string
                            metric_progress_type:
                              description: The progress calculation type. Permitted values "1" (last update), "2" (total), "3" (average).
                              type: string
                            metric_initial_data:
                              description: The starting value for the metric.
                              type: string
                            metric_target:
                              description: The target value for the metric.
                              type: string
                            metric_unit:
                              description: The data type for your metric. Permitted values "1" (number), "2" (currency), "3" (percentage).
                              type: string
                            metric_permission:
                              description: Optional Comma-separated list of view permissions for the metric. Permitted values for team goals are "team", "report", "internal", "any". Permitted values for personal goals are "owner", "manager", "internal". (If this parameter is not included in your request, it will automatically be set to the values in goal_permission.
                              type: string
              required:
              - goal_name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
