                                  type: string
                                  nullable: true
                                goal_permission:
                                  type: string
                                goal_category:
                                  type: array
                                  items:
                                    type: object
                                    description: An array of objects with the category identifier and name for the category.
                                    properties:
                                      id:
                                        type: string
                                      name:
                                        type: string
                                goal_metrics:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      metric_id:
                                        type: string
                                      metric_owner:
                                        type: string
                                      metric_real_owner:
                                        type: string
                                      metric_name:
                                        type: string
                                      metric_update_interval:
                                        type: object
                                        properties:
                                          id:
                                            type: string
                                          name:
                                            type: string
                                      metric_update_interval_day:
                                        type: string
                                      metric_unit:
                                        type: object
                                        properties:
                                          id:
                                            type: string
                                          name:
                                            type: string
                                      metric_progress_type:
                                        type: object
                                        properties:
                                          id:
                                            type: string
                                          name:
                                            type: string
                                      metric_counting_type:
                                        type: object
                                        properties:
                                          id:
                                            type: string
                                          name:
                                            type: string
                                      metric_initial_data:
                                        type: string
                                      metric_target:
                                        type: string
                                      metric_achieve_target:
                                        description: What has been achieved against the `metric_target`.
                                        type: string
                                      metric_create_at:
                                        type: string
                                        description: The GMT timestamp value for the created at time.
                                      metric_modified_at:
                                        type: string
                                      metric_created_by:
                                        type: string
                                      metric_updated_by:
                                        type: string
                                      metric_progress:
                                        description: The `metric_achieve_target` divided by the `metric_target` as a percent.
                                        type: string
                                      metric_progress_color:
                                        type: string
                                      metric_last_update:
                                        type: string
                                      metric_next_update:
                                        type: string
