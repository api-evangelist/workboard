                              title:
                                type: string
                              company:
                                type: string
                          goal:
                            type: object
                            oneOf:
                            - properties:
                                goal_id:
                                  type: string
                                goal_name:
                                  type: string
                                goal_narrative:
                                  type: string
                                goal_type:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                    name:
                                      type: string
                                goal_owner:
                                  type: string
                                goal_create_at:
                                  type: string
                                goal_modified_at:
                                  type: string
                                goal_created_by:
                                  type: string
                                goal_updated_by:
                                  type: string
                                goal_start_date:
                                  type: string
                                goal_target_date:
                                  type: string
                                goal_progress:
                                  type: string
                                goal_progress_color:
                                  type: string
                                goal_status:
                                  type: string
                                goal_owner_full_name:
                                  type: string
                                goal_team_id:
                                  type: string
                                  nullable: true
