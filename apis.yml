aid: workboard
name: WorkBoard
description: >-
  WorkBoard (WorkBoardAI) is an AI-native strategy, OKR, and strategic
  portfolio management platform used by enterprises like Cisco, AstraZeneca,
  and Mercedes-Benz to connect strategy pillars, outcomes, investments, and
  OKRs. Its External REST API (v1) exposes users, teams, goals (objectives),
  metrics (key results), action items, workstreams, and datastreams; the
  Public API v2 manages custom attributes; a SCIM 2.0 API handles user
  provisioning; and a published MCP server gives AI agents scoped access to
  OKRs, KPIs, scorecards, business reviews, and meetings.
